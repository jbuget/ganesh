services:
  db:
    image: postgres:16-alpine
    container_name: timesheet-db
    environment:
      POSTGRES_USER: timesheet
      POSTGRES_PASSWORD: timesheet
      POSTGRES_DB: timesheet
    ports:
      - "${POSTGRES_PORT:-54324}:5432"
    volumes:
      - timesheet-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timesheet"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  timesheet-db-data:
