services:
  db:
    image: postgres:18-alpine
    # Nomme d'apres le projet : deux instances du depot peuvent tourner cote a
    # cote sans se disputer le nom du conteneur.
    container_name: ${COMPOSE_PROJECT_NAME:-timesheet}-db
    environment:
      POSTGRES_USER: timesheet
      POSTGRES_PASSWORD: timesheet
      POSTGRES_DB: timesheet
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 range ses donnees dans `/var/lib/postgresql/18/docker` et
      # non plus dans `/var/lib/postgresql/data` : on monte le parent, sans quoi
      # le volume serait ignore et la base repartirait vide a chaque demarrage.
      - timesheet-db-data:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timesheet"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  timesheet-db-data:
