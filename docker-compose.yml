services:
  db:
    image: postgres:18-alpine
    # Named after the project: two copies of the repository can run side by
    # side without fighting over the container name.
    container_name: ${COMPOSE_PROJECT_NAME:-timesheet}-db
    environment:
      POSTGRES_USER: timesheet
      POSTGRES_PASSWORD: timesheet
      POSTGRES_DB: timesheet
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 keeps its data in `/var/lib/postgresql/18/docker` and no
      # longer in `/var/lib/postgresql/data`: we mount the parent, otherwise the
      # volume would be ignored and the database would start empty every time.
      - timesheet-db-data:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timesheet"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  timesheet-db-data:
