name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Serveur — lint, architecture, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    # Les tests d'integration touchent une vraie base, comme le veut le projet :
    # le double en memoire rend les objets qu'on lui confie la ou la base en
    # reconstruit d'autres, et c'est precisement cet ecart qu'ils surveillent.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: timesheet
          POSTGRES_PASSWORD: timesheet
          POSTGRES_DB: timesheet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Format et lint
        run: |
          isort --check-only src/ tests/
          black --check src/ tests/
          ruff check src/ tests/
          flake8 src/ tests/
          mypy src/

      - name: Contrats d'architecture (Clean Architecture)
        run: lint-imports --config .importlinter

      - name: Tests
        run: pytest
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://timesheet:timesheet@localhost:5432/timesheet_test

  client:
    name: Client — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Lint (dont Atomic Design)
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Types
        run: pnpm type-check

      - name: Tests
        run: pnpm test
