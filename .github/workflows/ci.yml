name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server — lint, architecture, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    # Integration tests hit a real database, as the project asks: the in-memory
    # double hands back the very objects it was given, where the database
    # rebuilds others, and that gap is exactly what they watch.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: timesheet
          POSTGRES_PASSWORD: timesheet
          POSTGRES_DB: timesheet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Install the dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Format and lint
        run: |
          isort --check-only src/ tests/
          black --check src/ tests/
          ruff check src/ tests/
          flake8 src/ tests/
          mypy src/

      - name: Architecture contracts (Clean Architecture)
        run: lint-imports --config .importlinter

      # A column renamed without its index, a model changed without a
      # migration: schema and models drift apart in silence, and nothing said
      # so until the next autogenerate, which then carried the correction in a
      # diff where nobody was looking for it.
      - name: Schema in step with the models
        run: |
          alembic upgrade head
          alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://timesheet:timesheet@localhost:5432/timesheet_test

      - name: Tests
        run: pytest
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://timesheet:timesheet@localhost:5432/timesheet_test

  client:
    name: Client — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install the dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Atomic Design included)
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Types
        run: pnpm type-check

      - name: Tests
        run: pnpm test

  # The production image, built but never pushed. Without this the Dockerfile is
  # first exercised by a deploy, which is one merge too late to find out it does
  # not build. amd64 on the runner: the layers are the same, and the arm64 build
  # the deploy does needs QEMU for no gain here.
  api-image:
    name: API — the production image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          cache-from: type=gha,scope=api-ci
          cache-to: type=gha,mode=max,scope=api-ci
