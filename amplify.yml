# ---------------------------------------------------------------------------
# AWS Amplify build for the Ganesh client (https://ganesh.waat.tools).
#
# The client is a BFF: its Route Handlers carry the Entra flow and relay to the
# API, so this is an SSR deployment (Amplify's WEB_COMPUTE platform), never a
# static export. Amplify detects it from `.next` — do not add an `out`
# directory or `output: "export"` to next.config.ts.
#
# Every variable the server reads at run time has to go through
# `.env.production`, written here at build time.
#
# The console's environment variables are handed to the *build*, not to the
# SSR compute: a route handler asking for `process.env.SESSION_SECRET` at run
# time finds nothing, and signing in answers 500. Copying them into
# `.env.production` is what carries them across — it is how Next reads server
# environment on Amplify, and there is no other way in without a compute role.
#
# So the secrets do end up in the build artefact. That is a real cost, weighed
# and accepted: the artefact is readable by whoever can read the Amplify
# deployment, which is the same set of people who can read the console
# variables they come from. Nothing here is ever exposed to the browser —
# only `NEXT_PUBLIC_` names are, and there are none.
# ---------------------------------------------------------------------------
version: 1
applications:
  - appRoot: client
    frontend:
      phases:
        preBuild:
          commands:
            # pnpm, at the version the lockfile was written with. Corepack
            # ships with the Node 22 image Amplify runs.
            - corepack enable
            - corepack prepare pnpm@10.29.2 --activate
            - pnpm install --frozen-lockfile
            # What the BFF needs to reach the API, and where it answers from.
            # Written here rather than in the console so it survives the app
            # being recreated, and so it is readable in the repository.
            - echo "API_URL=https://api.ganesh.waat.tools" > .env.production
            - echo "API_PREFIX=/api/v1" >> .env.production
            - echo "APP_URL=https://ganesh.waat.tools" >> .env.production
            # A build that ships a client nobody can sign in to is a failed
            # build, not a deployed one. Said here rather than discovered in a
            # 500 an hour later.
            - test -n "$SESSION_SECRET" || { echo "SESSION_SECRET is unset in the Amplify console."; exit 1; }
            # From the console, because they differ per environment or must
            # not be committed. Quoted: a base64 secret carries `+`, `/` and
            # `=`, and an unquoted `#` would start a comment.
            - echo "SESSION_SECRET=\"$SESSION_SECRET\"" >> .env.production
            - echo "ALLOWED_EMAIL_DOMAIN=\"$ALLOWED_EMAIL_DOMAIN\"" >> .env.production
            - echo "AUTH_ENTRA=\"$AUTH_ENTRA\"" >> .env.production
            - echo "AZURE_AD_TENANT_ID=\"$AZURE_AD_TENANT_ID\"" >> .env.production
            - echo "AZURE_AD_CLIENT_ID=\"$AZURE_AD_CLIENT_ID\"" >> .env.production
            - echo "AZURE_AD_CLIENT_SECRET=\"$AZURE_AD_CLIENT_SECRET\"" >> .env.production
            - echo "AZURE_AD_REDIRECT_URI=\"$AZURE_AD_REDIRECT_URI\"" >> .env.production
        build:
          commands:
            - pnpm build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
